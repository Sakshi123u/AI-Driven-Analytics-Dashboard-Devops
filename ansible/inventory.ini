# This file is a TEMPLATE for local/manual runs only.
#
# During CI/CD, the GitHub Actions workflow (.github/workflows/cicd.yml)
# generates a real inventory.ini at runtime from GitHub Secrets
# (EC2_HOST, EC2_USERNAME, and the SSH key), so no real IP address or
# key path is ever committed to this repo.
#
# To run Ansible manually from your own machine against your EC2 box,
# copy this file, fill in the real values, and DO NOT commit the copy:
#
#   cp ansible/inventory.ini ansible/inventory.local.ini
#   # edit inventory.local.ini with your real host/key
#   ansible-playbook -i ansible/inventory.local.ini ansible/deploy.yml
#
[web]
YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=/path/to/your-key.pem
