apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-dashboard
  template:
    metadata:
      labels:
        app: analytics-dashboard
    spec:
      containers:
        - name: analytics-dashboard
          image: analytics-dashboard:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: OPENROUTER_API_KEY
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: '1'
