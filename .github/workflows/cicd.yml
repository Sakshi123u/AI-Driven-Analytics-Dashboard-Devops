name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI - Continuous Integration
  # =========================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Build Docker image
        run: |
          docker build -t ai-analytics-dashboard ./app


  # =========================
  # CD - Continuous Deployment
  # =========================

  deploy:
    name: Deploy using Ansible
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Create SSH private key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > fa1-key.pem
          chmod 600 fa1-key.pem

      - name: Create Ansible inventory
        run: |
          echo "[web]" > ansible/inventory.ini
          echo "${{ secrets.EC2_HOST }} ansible_user=${{ secrets.EC2_USERNAME }} ansible_ssh_private_key_file=../fa1-key.pem" >> ansible/inventory.ini

          echo "Generated inventory:"
          cat ansible/inventory.ini

      - name: Test Ansible connection
        run: |
          ansible all -i ansible/inventory.ini -m ping

      - name: Deploy application using Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --extra-vars "openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}"

      - name: Verify deployment
        run: |
          echo "Waiting for Streamlit to come up on port 8501..."
          for i in $(seq 1 10); do
            if curl -sSf "http://${{ secrets.EC2_HOST }}:8501" -o /dev/null; then
              echo "✅ Streamlit app is responding on port 8501."
              exit 0
            fi
            echo "Not ready yet, retrying in 10s... ($i/10)"
            sleep 10
          done
          echo "❌ Streamlit app did not respond on port 8501 after deployment."
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f fa1-key.pem